[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liveness-detection-backend"
version = "1.0.0"
description = "Local AI-Powered Facial Liveness Detection System Backend"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "alembic>=1.13.3,<2.0.0",
    "opencv-contrib-python>=4.10.0.84,<5.0.0",
    "mediapipe>=0.10.14,<0.11.0",
    "onnxruntime>=1.19.0,<2.0.0",
    "numpy>=1.26.4,<2.0.0",
    "python-multipart>=0.0.12,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.2,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.2,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_models: marks integration tests that require real ONNX model files installed in models/",
]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S311"]
"scripts/**/*.py" = ["S310"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
